name: Publish release from a build run

# Takes the installers from a successful "Build Windows installers" run and publishes them as a
# GitHub release tagged v<version> (the version the build used).
# If the release already exists it is left alone, unless "replace" is ticked (repairing a broken
# upload). The app's updater reads this repo's
# latest release, so the file ending in .x64.exe must be present. All four downloads (.x64.exe,
# .x64.msi, .x64-per-user.msi, .x64-portable.zip) must be in the run, or nothing is tagged. Releases up to 1.0.6-AK5 also get a
# .base.exe copy, because copies installed before the rename only look for that name.
# The build starts this workflow itself; you can also run it by hand with a run ID.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of the successful build run to publish"
        required: true
        type: string
      replace:
        description: "Replace the files of the release if it already exists (leave unticked to leave an existing release alone)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: release-from-run
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Find the commit the build used
        id: run
        run: |
          sha=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" --jq '.head_sha')
          conclusion=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" --jq '.conclusion')
          echo "Build run $RUN_ID used $sha (conclusion: $conclusion)"
          [ "$conclusion" = "success" ] || { echo "That build run did not succeed."; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.run.outputs.sha }}

      - name: Download the installers
        uses: actions/download-artifact@v4
        with:
          name: Anilife-Windows-Installers
          path: installers
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          SHA: ${{ steps.run.outputs.sha }}
          REPLACE: ${{ inputs.replace }}
        shell: bash
        run: |
          # The build writes the version it used into version.json, which covers a version typed in the
          # build form (the file at the build's commit still holds the old one). Older runs have it too.
          version="$(jq -r '.version' installers/version.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-AK[0-9]+)?$ ]] || { echo "Bad version '$version'"; exit 1; }
          tag="v$version"

          # Every download must be in the run before a tag or release is created.
          missing=""
          for suffix in x64.exe x64.msi x64-per-user.msi x64-portable.zip; do
            [ -f "installers/anilife-$version.$suffix" ] || missing="$missing anilife-$version.$suffix"
          done
          if [ -n "$missing" ]; then
            echo "::error::The build run is missing:$missing. Nothing was tagged or released. Re-run the build with every file ticked."
            exit 1
          fi

          mkdir -p upload
          cp installers/* upload/
          # Legacy name: copies installed before the rename only look for a .base.exe asset. Releases up to
          # and including LEGACY_LAST carry a copy; later ones do not. Change LEGACY_LAST only to extend it.
          LEGACY_LAST="1.0.6-AK5"
          if [ "$(printf '%s\n%s\n' "$version" "$LEGACY_LAST" | sort -V | tail -n1)" = "$LEGACY_LAST" ]; then
            cp "installers/anilife-$version.x64.exe" "upload/anilife-$version.base.exe"
            echo "Added the legacy .base.exe copy ($version is not after $LEGACY_LAST)."
          else
            echo "No legacy .base.exe copy ($version is after $LEGACY_LAST)."
          fi
          ls -l upload

          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if [ "$REPLACE" != "true" ]; then
              echo "Release $tag already exists, so it was left as it is. Tick replace to swap its files."
              echo "### Release" >> "$GITHUB_STEP_SUMMARY"
              echo "$tag already exists; nothing changed." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Release $tag exists, replacing its files."
            gh release upload "$tag" upload/* --clobber --repo "${{ github.repository }}"
          else
            gh release create "$tag" upload/* \
              --repo "${{ github.repository }}" \
              --target "$SHA" \
              --title "Anilife $version (Windows)" \
              --notes "Windows installers built from this fork, which includes the MyAnimeList sign-in fix. The app checks this release for updates. Installers are unsigned, so Windows SmartScreen may warn."
          fi
          echo "### Release" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
