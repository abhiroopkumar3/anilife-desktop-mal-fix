name: Sync from upstream

# Merges the latest code from the original repo (anilifecommunity/kotlindesktop) into this fork's
# main branch, keeping this fork's own changes (the MyAnimeList fix and the updater address).
# Two things are always ours and never taken from upstream: everything in .github/workflows and README.md.
# If upstream changed the same lines as this fork, the run stops and reports the conflict without
# changing anything, so it can be fixed by hand.
#
# Runs weekly at 00:30 Austin time (America/Chicago, daylight saving handled by GitHub), or manually.
# A build is started only when the version in app/build.gradle.kts has no release here yet.
# "Force build" starts one regardless.

on:
  schedule:
    - cron: "30 0 * * 1"
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      build_after_sync:
        description: "Start a build if this version has no release yet"
        type: boolean
        default: true
      force_build:
        description: "Start a build even if this version already has a release"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_URL: https://github.com/anilifecommunity/kotlindesktop.git
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream, keeping our workflows and README
        id: sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --no-tags "$UPSTREAM_URL" main:refs/remotes/upstream/main
          up_sha=$(git rev-parse upstream/main)

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream ${up_sha:0:7}."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Merge without committing; conflicts are handled below.
          git merge --no-commit --no-ff upstream/main || true

          # .github/workflows and README.md are always ours, whatever upstream did to them.
          git rm -r -q -f --cached --ignore-unmatch .github/workflows
          rm -rf .github/workflows
          git checkout HEAD -- .github/workflows README.md

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Merge conflict between upstream and this fork in:"
            git diff --name-only --diff-filter=U
            git merge --abort
            echo "Nothing was changed. Resolve these files by hand."
            exit 1
          fi

          git commit -q -m "Merge upstream ${up_sha:0:7} into main"

          # Safety net: the merge must not touch the workflows folder or README compared with main.
          if git diff --name-only HEAD~1 HEAD | grep -E '^(\.github/workflows/|README\.md$)'; then
            echo "Refusing to push: the merge changed the workflows folder or README."
            exit 1
          fi

          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Merged upstream ${up_sha:0:7}"

      - name: Check whether this version already has a release
        id: version
        shell: bash
        run: |
          version=$(grep -oP 'val defaultVersion = "\K[^"]+' app/build.gradle.kts)
          tag="v$version"
          if out=$(gh api "repos/${{ github.repository }}/releases/tags/$tag" 2>&1); then
            echo "Release $tag already exists."
            echo "need_build=false" >> "$GITHUB_OUTPUT"
          elif echo "$out" | grep -q "Not Found"; then
            echo "No release for $tag yet, a build is needed."
            echo "need_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Could not check releases: $out"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "### Version check"
            echo "app/build.gradle.kts version: \`$version\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start a build
        if: (steps.version.outputs.need_build == 'true' && inputs.build_after_sync != false) || inputs.force_build == true
        run: gh workflow run build-windows.yml --repo "${{ github.repository }}" --ref main
