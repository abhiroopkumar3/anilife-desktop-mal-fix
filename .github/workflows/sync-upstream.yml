name: Sync from upstream

# Copies the latest code from the original repo (anilifecommunity/kotlindesktop) onto this fork's
# sync/upstream branch, and nothing else. It does not touch main, merge/fork-conflicts, the version
# file or any release, and it never starts a build. sync/upstream is a plain mirror of upstream's main.
#
# What happens next is done by hand: merge sync/upstream into merge/fork-conflicts, fix any conflicts,
# test, then merge that branch into main and publish from there.
#
# The push is fast-forward only. If upstream ever rewrites its history, the push is refused and the run
# fails instead of overwriting anything.
#
# Pushes with the built-in token cannot add or change files under .github/workflows. If upstream changes
# its own workflow files, that push is refused by GitHub; the run then fails and says so, and the branch
# has to be updated once from a computer with git.
#
# Runs weekly at 00:30 Austin time (America/Chicago, daylight saving handled by GitHub), or manually.

on:
  schedule:
    - cron: "30 0 * * 1"
      timezone: "America/Chicago"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_URL: https://github.com/anilifecommunity/kotlindesktop.git
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update sync/upstream from upstream main
        shell: bash
        run: |
          git fetch --no-tags "$UPSTREAM_URL" main:refs/remotes/upstream/main
          up_sha=$(git rev-parse upstream/main)

          if git ls-remote --exit-code --heads origin sync/upstream > /dev/null; then
            git fetch --no-tags origin sync/upstream:refs/remotes/origin/sync/upstream
            if git merge-base --is-ancestor upstream/main origin/sync/upstream; then
              echo "sync/upstream already has upstream ${up_sha:0:7}. Nothing to do."
              echo "### Sync from upstream" >> "$GITHUB_STEP_SUMMARY"
              echo "Already up to date at \`${up_sha:0:7}\`." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          if ! out=$(git push origin "upstream/main:refs/heads/sync/upstream" 2>&1); then
            echo "$out"
            if echo "$out" | grep -qi "workflow"; then
              echo "GitHub refused the push because upstream changed files under .github/workflows."
              echo "The built-in token is not allowed to do that. Update sync/upstream by hand with git."
            else
              echo "The push was refused (not a fast-forward?). Nothing was overwritten."
            fi
            exit 1
          fi
          echo "$out"

          {
            echo "### Sync from upstream"
            echo "sync/upstream is now at upstream \`${up_sha:0:7}\`."
            echo "Next: merge sync/upstream into merge/fork-conflicts by hand."
          } >> "$GITHUB_STEP_SUMMARY"
