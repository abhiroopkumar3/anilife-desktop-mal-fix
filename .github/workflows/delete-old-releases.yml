name: Delete old releases (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the superseded releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in v1.0.7 v1.0.8; do
            gh release delete "$tag" --repo "${{ github.repository }}" --cleanup-tag --yes
          done
          gh release list --repo "${{ github.repository }}"
