name: Delete old releases (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the superseded releases, their tags and the ak1 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in v1.0.6-AK1 v1.0.6-AK2; do
            gh release delete "$tag" --repo "${{ github.repository }}" --cleanup-tag --yes
          done
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/ak1"
          gh release list --repo "${{ github.repository }}"
