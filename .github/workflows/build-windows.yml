name: Build Windows installers

# Builds the Windows installers (.msi and .exe, installed and portable) from the code on main and
# uploads them as the artifact "Anilife-Windows-Installers" (kept 90 days).
# On success it starts "Publish release from a build run", which tags and publishes the release.
# The version comes from fork-version.properties (<base>-AK<revision>).

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: build-windows
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run tests
        run: .\gradlew test --no-daemon --no-configuration-cache

      # Version comes from the tag (v1.2.3 -> 1.2.3), otherwise from fork-version.properties.
      - name: Resolve version
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $props = @{}
            Get-Content fork-version.properties | ForEach-Object { if ($_ -match '^\s*(base|revision)\s*=\s*(\S+)\s*$') { $props[$Matches[1]] = $Matches[2] } }
            $v = "$($props['base'])-AK$($props['revision'])"
          }
          if ($v -notmatch '^\d+\.\d+\.\d+(-AK\d+)?$') { throw "Version '$v' must look like 1.2.3 or 1.2.3-AK1" }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Building version $v"

      - name: Build base installers (.msi + .exe)
        run: |
          .\gradlew :app:packageMsi :app:packageExe "-PappVersion=$env:VERSION" --no-daemon --no-configuration-cache
          New-Item -ItemType Directory -Force dist | Out-Null
          $bin = "app/build/compose/binaries/main"
          Copy-Item (Get-ChildItem "$bin/msi/*.msi" | Select-Object -First 1) "dist/anilife-$env:VERSION#base.msi"
          Copy-Item (Get-ChildItem "$bin/exe/*.exe" | Select-Object -First 1) "dist/anilife-$env:VERSION#base.exe"

      - name: Build portable .msi (no shortcuts, per-user, choose folder)
        run: |
          .\gradlew :app:packageMsi "-PappVersion=$env:VERSION" -Pportable=true --no-daemon --no-configuration-cache
          $msi = Get-ChildItem "app/build/compose/binaries/main/msi/*.msi" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Copy-Item $msi "dist/anilife-$env:VERSION#portable.msi"

      # Portable .exe: a single self-extracting file wrapping the app image.
      # Double-click -> unpacks to a temp folder -> launches AniLife. Nothing is installed.
      - name: Build portable .exe (self-extracting)
        run: |
          .\gradlew :app:createDistributable "-PappVersion=$env:VERSION" --no-daemon --no-configuration-cache
          $img = "app/build/compose/binaries/main/app/AniLife"
          if (-not (Test-Path "$img/AniLife.exe")) { throw "App image not found at $img" }

          $sevenZip = "C:\Program Files\7-Zip"
          & "$sevenZip\7z.exe" a -t7z -mx=5 sfx-payload.7z "$img\*"
          if ($LASTEXITCODE -ne 0) { throw "7z failed" }

          @'
          ;!@Install@!UTF-8!
          Title="AniLife"
          GUIMode="1"
          RunProgram="AniLife.exe"
          ;!@InstallEnd@!
          '@ -replace '(?m)^\s+', '' | Set-Content -Encoding utf8NoBOM sfx-config.txt

          # Set the icon on the empty stub first. Rewriting resources after the payload is appended
          # drops the appended data and leaves a tiny, useless exe.
          Copy-Item "$sevenZip\7z.sfx" sfx-stub.sfx
          & "$PWD/scripts/Set-ExeIcon.ps1" -Path "sfx-stub.sfx" -Icon "app/src/main/resources/anilife.ico"

          $out = "dist/anilife-$env:VERSION#portable.exe"
          $stream = [IO.File]::Create((Join-Path $PWD $out))
          foreach ($f in @("sfx-stub.sfx", "sfx-config.txt", "sfx-payload.7z")) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $f))
            $stream.Write($bytes, 0, $bytes.Length)
          }
          $stream.Close()

      - name: Write version manifest
        run: |
          $exe = "dist/anilife-$env:VERSION#base.exe"
          $asset = [ordered]@{
            platform = "windows"
            url = "https://github.com/abhiroopkumar3/anilife-desktop-mal-fix/releases/download/v$env:VERSION/anilife-$env:VERSION.base.exe"
            sha256 = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash
            size = [int64](Get-Item $exe).Length
          }
          $manifest = [ordered]@{
            version = $env:VERSION
            channel = "beta"
            releasedAt = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
            minVersion = "1.0.0"
            releaseNotes = "Auto-update manifest for AniLife."
            assets = @($asset)
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 (Join-Path $PWD "dist/version.json")

      - name: List outputs
        run: |
          Get-ChildItem dist | ForEach-Object { "{0,8:N1} MB  {1}" -f ($_.Length/1MB), $_.Name }
          $portable = Get-Item "dist/anilife-$env:VERSION#portable.exe"
          if ($portable.Length -lt 50MB) { throw "Portable exe is only $($portable.Length) bytes; the payload is missing." }

      # "#" in file names can trip up artifact uploads, and GitHub turns it into "." on release
      # upload anyway, so use the final names (anilife-1.0.7.base.exe) from here on.
      - name: Use dot names
        run: Get-ChildItem dist | Rename-Item -NewName { $_.Name -replace '#', '.' }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Anilife-Windows-Installers
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Record version
        run: |
          "### Windows build" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Version: ``$env:VERSION``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Start the release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-from-run.yml --repo "${{ github.repository }}" --ref main -f run_id="${{ github.run_id }}"
