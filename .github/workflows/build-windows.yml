name: Build Windows installers

# Builds the 64-bit Windows downloads from the code on main: the setup wizard (.exe), the system-wide
# and the per-user .msi, and a portable .zip. Uploads them as the artifact "Anilife-Windows-Installers"
# (kept 90 days). Files are named anilife-<version>.x64.exe, .x64.msi, .x64-per-user.msi and
# .x64-portable.zip.
# On success it starts "Publish release from a build run", which tags and publishes the release.
# The version comes from fork-version.properties (<base>-AK<revision>).
#
# It starts three ways:
#   - You push a change to fork-version.properties on main (a revision bump). If that version already
#     has a release the run stops at once, so editing a comment in the file never rebuilds a release.
#   - "Sync from upstream" starts it itself when the version has no release yet. That sync pushes with
#     the built-in token, and GitHub does not start workflows from such pushes, so the two never both
#     fire for the same change. Do not switch the sync to a personal access token without revisiting this.
#   - You press "Run workflow". This always builds, as often as you like, even for a version that
#     already has a release. Untick "Publish" to only get the installers as a downloadable artifact.
#     With "Publish" ticked the release workflow decides: it leaves an existing release alone.
#
# File boxes on "Run workflow": one tick box per download (.x64.exe, .x64.msi, .x64-per-user.msi,
# .x64-portable.zip), all ticked by default. GitHub has no "select all" box, so untick what you do not
# want. Pushes and syncs always build everything. Publishing needs the .exe, so a run with "Publish"
# ticked and the .exe unticked stops straight away.
#
# Version boxes on "Run workflow": Base and Revision are optional and count only when "Publish" is
# ticked. Left empty, the version comes from fork-version.properties. Typed, they are checked
# (base 1.2.3 and never below the current base, revision a whole number) and written back
# to fork-version.properties on main once the build succeeds, so the file always names the newest
# release. That commit uses the built-in token, so it does not start another build.

on:
  push:
    branches: [main]
    paths: [fork-version.properties]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release from this build (untick to only upload the installers)"
        type: boolean
        default: true
      exe:
        description: "Build the setup wizard (.x64.exe). Needed when Publish is ticked, because the updater uses it"
        type: boolean
        default: true
      msi:
        description: "Build the system-wide installer (.x64.msi)"
        type: boolean
        default: true
      per_user_msi:
        description: "Build the per-user installer (.x64-per-user.msi)"
        type: boolean
        default: true
      portable_zip:
        description: "Build the portable .zip (.x64-portable.zip)"
        type: boolean
        default: true
      base:
        description: "Base version, only used when Publish is ticked. Format 1.0.6 (digits.digits.digits). Leave empty to use fork-version.properties"
        type: string
        required: false
        default: ""
      revision:
        description: "Revision, only used when Publish is ticked. Format: a whole number such as 4. Leave empty to use fork-version.properties"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: write

concurrency:
  group: build-windows
  cancel-in-progress: false

jobs:
  # A push that only touches the comments in fork-version.properties must not rebuild a release.
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      base: ${{ steps.version.outputs.base }}
      revision: ${{ steps.version.outputs.revision }}
      version: ${{ steps.version.outputs.version }}
      override: ${{ steps.version.outputs.override }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version and skip a push whose version already has a release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PUBLISH: ${{ inputs.publish }}
          TYPED_BASE: ${{ inputs.base }}
          TYPED_REVISION: ${{ inputs.revision }}
        run: |
          base="$(grep -oP '^base=\K\S+' fork-version.properties)"
          revision="$(grep -oP '^revision=\K\S+' fork-version.properties)"
          override=false

          # Typed values must be well formed whether or not they end up used, so a typo is never ignored quietly.
          if [ -n "$TYPED_BASE" ] && ! [[ "$TYPED_BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Base '$TYPED_BASE' must look like 1.0.6 (digits.digits.digits, no spaces)."; exit 1
          fi
          if [ -n "$TYPED_REVISION" ] && ! [[ "$TYPED_REVISION" =~ ^[0-9]+$ ]]; then
            echo "::error::Revision '$TYPED_REVISION' must be a whole number such as 4 (digits only, no spaces)."; exit 1
          fi
          if [ -n "$TYPED_BASE" ] && [ -z "$TYPED_REVISION" ]; then
            echo "::error::A base was typed without a revision. Type the revision too (use 1 for a new base)."; exit 1
          fi

          # With Publish ticked, the base may stay or go up, never down (1.0.10 is above 1.0.9). The
          # revision has no such rule. The file's base is the newest one, because it is kept in step.
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$PUBLISH" = "true" ] && [ -n "$TYPED_BASE" ]; then
            lowest="$(printf '%s\n%s\n' "$base" "$TYPED_BASE" | sort -V | head -n1)"
            if [ "$lowest" != "$base" ]; then
              echo "::error::Base $TYPED_BASE is lower than the current base $base. It can stay the same or go up, never down."; exit 1
            fi
          fi

          if [ "$EVENT" = "workflow_dispatch" ] && [ "$PUBLISH" = "true" ] && { [ -n "$TYPED_BASE" ] || [ -n "$TYPED_REVISION" ]; }; then
            override=true
            [ -n "$TYPED_BASE" ] && base="$TYPED_BASE"
            [ -n "$TYPED_REVISION" ] && revision="$TYPED_REVISION"
          elif [ -n "$TYPED_BASE$TYPED_REVISION" ]; then
            echo "The version boxes are ignored because this run does not publish; using the version in fork-version.properties."
          fi
          version="$base-AK$revision"
          skip=false
          if [ "${{ github.event_name }}" = "push" ]; then
            if out=$(gh api "repos/${{ github.repository }}/releases/tags/v$version" 2>&1); then
              skip=true
              echo "Release v$version already exists; nothing to build. Raise revision to ship a new version."
            elif ! echo "$out" | grep -q "Not Found"; then
              echo "Could not check releases: $out"
              exit 1
            fi
          fi
          {
            echo "skip=$skip"
            echo "version=$version"
            echo "override=$override"
            echo "base=$base"
            echo "revision=$revision"
          } >> "$GITHUB_OUTPUT"
          echo "### Version check" >> "$GITHUB_STEP_SUMMARY"
          echo "Version \`$version\`, typed in the form: $override, skip build: $skip" >> "$GITHUB_STEP_SUMMARY"

  build-windows:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: windows-latest
    permissions:
      contents: write
      actions: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run tests
        run: .\gradlew test --no-daemon --no-configuration-cache

      # Version comes from the tag (v1.2.3 -> 1.2.3), otherwise from the check job: the values typed
      # in the Run workflow form, or else fork-version.properties.
      - name: Resolve version
        env:
          CHECKED_VERSION: ${{ needs.check.outputs.version }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $v = $env:CHECKED_VERSION
          }
          if ($v -notmatch '^\d+\.\d+\.\d+(-AK\d+)?$') { throw "Version '$v' must look like 1.2.3 or 1.2.3-AK1" }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Building version $v"

      # Every build step below runs unless its box was unticked (an empty input, as on a push, counts as ticked).
      - name: Check the chosen files
        if: inputs.publish != false && inputs.exe == false
        run: |
          Write-Error "Publishing needs the .x64.exe (the updater uses it). Tick it, or untick Publish."
          exit 1

      - name: Make the output folder
        run: New-Item -ItemType Directory -Force dist | Out-Null

      # The setup wizard (.exe) is built with Inno Setup further down; the two .msi files come from Gradle.
      - name: Build the system-wide installer (.msi)
        if: inputs.msi != false
        run: |
          .\gradlew :app:packageMsi "-PappVersion=$env:VERSION" --no-daemon --no-configuration-cache
          $bin = "app/build/compose/binaries/main"
          Copy-Item (Get-ChildItem "$bin/msi/*.msi" | Select-Object -First 1) "dist/anilife-$env:VERSION.x64.msi"

      - name: Build the per-user installer (.msi, no shortcuts, per-user, choose folder)
        if: inputs.per_user_msi != false
        run: |
          .\gradlew :app:packageMsi "-PappVersion=$env:VERSION" -PperUser=true --no-daemon --no-configuration-cache
          $msi = Get-ChildItem "app/build/compose/binaries/main/msi/*.msi" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Copy-Item $msi "dist/anilife-$env:VERSION.x64-per-user.msi"

      # The app image is what the setup wizard packs and what the portable .zip holds. Unzip, run
      # AniLife.exe, nothing is installed. The folder itself goes in the zip, so unzipping makes one
      # AniLife folder instead of scattering files.
      - name: Build the app image
        if: inputs.exe != false || inputs.portable_zip != false
        run: |
          .\gradlew :app:createDistributable "-PappVersion=$env:VERSION" --no-daemon --no-configuration-cache
          $img = "app/build/compose/binaries/main/app/AniLife"
          if (-not (Test-Path "$img/AniLife.exe")) { throw "App image not found at $img" }

      - name: Build the portable .zip
        if: inputs.portable_zip != false
        run: |
          $img = "app/build/compose/binaries/main/app/AniLife"
          $zip = Join-Path $PWD "dist/anilife-$env:VERSION.x64-portable.zip"
          Push-Location (Split-Path $img -Parent)
          & "C:\Program Files\7-Zip\7z.exe" a -tzip -mx=5 $zip "AniLife"
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "7z failed ($code)" }

      # The installer wizard: install folder, Start Menu folder, desktop shortcut, then a last page
      # with Launch and a GitHub link. Packs the same app image the portable .zip holds.
      - name: Build installer wizard (.exe)
        if: inputs.exe != false
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          $img = Join-Path $PWD "app/build/compose/binaries/main/app/AniLife"
          if (-not (Test-Path "$img/AniLife.exe")) { throw "App image not found at $img" }
          & $iscc "/DVersion=$env:VERSION" "/DSourceDir=$img" "/O$PWD\dist" "/Fanilife-$env:VERSION.x64" scripts/installer/anilife.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }
          $wizard = Get-Item "dist/anilife-$env:VERSION.x64.exe"
          if ($wizard.Length -lt 50MB) { throw "Installer is only $($wizard.Length) bytes; the payload is missing." }

      - name: Write version manifest
        if: inputs.exe != false
        run: |
          $exe = "dist/anilife-$env:VERSION.x64.exe"
          $asset = [ordered]@{
            platform = "windows"
            url = "https://github.com/abhiroopkumar3/anilife-desktop-mal-fix/releases/download/v$env:VERSION/anilife-$env:VERSION.x64.exe"
            sha256 = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash
            size = [int64](Get-Item $exe).Length
          }
          $manifest = [ordered]@{
            version = $env:VERSION
            channel = "beta"
            releasedAt = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
            minVersion = "1.0.0"
            releaseNotes = "Auto-update manifest for AniLife."
            assets = @($asset)
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 (Join-Path $PWD "dist/version.json")

      - name: List outputs
        run: |
          Get-ChildItem dist | ForEach-Object { "{0,8:N1} MB  {1}" -f ($_.Length/1MB), $_.Name }
          $portable = Get-Item "dist/anilife-$env:VERSION.x64-portable.zip" -ErrorAction SilentlyContinue
          if ($portable -and $portable.Length -lt 50MB) { throw "Portable zip is only $($portable.Length) bytes; the payload is missing." }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Anilife-Windows-Installers
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Record version
        run: |
          "### Windows build" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Version: ``$env:VERSION``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # A version typed in the form becomes the file's version, so the release workflow (which reads
      # the file) publishes it and the next sync compares against it.
      - name: Save the typed version to fork-version.properties
        if: needs.check.outputs.override == 'true'
        env:
          NEW_BASE: ${{ needs.check.outputs.base }}
          NEW_REVISION: ${{ needs.check.outputs.revision }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          (Get-Content fork-version.properties) |
            ForEach-Object { $_ -replace '^base=.*$', "base=$env:NEW_BASE" -replace '^revision=.*$', "revision=$env:NEW_REVISION" } |
            Set-Content fork-version.properties
          git add fork-version.properties
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Set version to $env:NEW_BASE-AK$env:NEW_REVISION from the build form"
            git push origin HEAD:main
          } else {
            "fork-version.properties already holds $env:NEW_BASE-AK$env:NEW_REVISION."
          }

      - name: Start the release workflow
        if: inputs.publish != false
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-from-run.yml --repo "${{ github.repository }}" --ref main -f run_id="${{ github.run_id }}"
