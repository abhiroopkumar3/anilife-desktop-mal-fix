# This fork's release version is <base>-AK<revision>, for example 1.0.6-AK3.
#
# base      The newest release the original project has published. The sync workflow moves it forward
#           by itself when the original publishes a newer one, and sets revision back to 1.
# revision  Raise this by hand when the fork ships changes of its own on the same base.
#
# The original's own version line in app/build.gradle.kts is left exactly as upstream writes it, so
# their version bumps never conflict with this fork.
base=1.0.6
revision=3
